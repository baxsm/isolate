[project]
name = "isolate"
version = "0.1.0"
description = "MVCC engine with real isolation levels and anomaly detection"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "pydantic==2.13.4",
    "networkx==3.6.1",
    "sqlglot==30.17.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.165.8",
    "ruff==0.16.3",
    "mypy==2.3.0",
    "httpx2==2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/isolate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["isolate"]
mypy_path = "src"
